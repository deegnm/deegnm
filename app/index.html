<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GnM U16 Team Manager</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6B1A2A">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1A2A; --maroon-deep:#47101C; --maroon-line:#8A2E40;
  --sky:#4AADE8; --yellow:#F5C842;
  --paper:#F6F2EC; --card:#FFFFFF; --ink:#241318; --muted:#7A6A6E;
  --line:#E7DFD6; --good:#2E7D4F; --bad:#B3372F;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Barlow',system-ui,sans-serif; background:var(--paper); color:var(--ink);
  min-height:100vh; padding-bottom:84px; font-size:15px;
}
/* Sideline Mode: bigger text, thicker borders and buttons for bright glare / gloved thumbs */
body.sideline{ font-size:19px; }
body.sideline .card{ border-width:2.5px; }
body.sideline button{ font-size:19px; padding:15px 16px; border-width:2.5px; }
body.sideline .btn-sm{ font-size:15px; padding:10px 14px; }
body.sideline h2{ font-size:23px; }
body.sideline .sc{ font-size:56px; }
body.sideline .timer-clock{ font-size:52px; }
body.sideline label.f{ font-size:13px; }
body.sideline input,body.sideline select{ font-size:19px; padding:14px 14px; }
.print-only{ display:none; }
@media print{
  body > *:not(#print-report){ display:none !important; }
  #print-report{ display:block !important; padding:20px; color:#000; font-family:'Barlow',sans-serif; }
  #print-report h1{ font-size:22px; margin:0 0 2px; }
  #print-report .rep-sub{ color:#555; font-size:12px; margin-bottom:18px; }
  #print-report h2{ font-size:16px; color:#6B1A2A; border-bottom:1.5px solid #6B1A2A; padding-bottom:3px; margin-top:22px; }
  #print-report table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  #print-report th{ text-align:left; border-bottom:1.5px solid #333; padding:4px 6px; }
  #print-report td{ border-bottom:1px solid #ccc; padding:4px 6px; }
  #print-report .rep-logo{ width:44px; height:44px; float:left; margin-right:12px; }
}
h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif; letter-spacing:.02em;}
header.app{
  background:var(--maroon); color:#fff; padding:14px 16px 12px;
  border-bottom:4px solid var(--yellow);
}
header.app h1{margin:0; font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;}
header.app .sub{font-size:12px; color:var(--yellow); text-transform:uppercase; letter-spacing:.14em; font-weight:600;}
main{padding:14px 14px 20px; max-width:640px; margin:0 auto;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.card h2{margin:0 0 10px; font-size:19px; font-weight:700; text-transform:uppercase; color:var(--maroon);}
.card h3{margin:14px 0 8px; font-size:16px; font-weight:700; text-transform:uppercase; color:var(--ink);}
.row{display:flex; gap:8px; align-items:center;}
.grow{flex:1;}
input,select{
  font-family:'Barlow',sans-serif; font-size:15px; padding:10px 12px; width:100%;
  border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
}
input:focus,select:focus{outline:none; border-color:var(--sky);}
label.f{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:10px 0 4px;}
button{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  border:none; border-radius:10px; cursor:pointer; font-size:16px; padding:11px 16px;
}
.btn-p{background:var(--maroon); color:#fff;}
.btn-p:active{background:var(--maroon-deep);}
.btn-y{background:var(--yellow); color:var(--maroon-deep);}
.btn-s{background:var(--sky); color:#fff;}
.btn-ghost{background:transparent; color:var(--maroon); border:1.5px solid var(--maroon);}
.btn-danger{background:transparent; color:var(--bad); border:1.5px solid var(--bad);}
.btn-sm{font-size:13px; padding:6px 10px;}
.btn-block{width:100%;}
button:disabled{opacity:.4;}
.pill{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; padding:3px 8px; border-radius:99px;}
.pill.pitch{background:#E4F2E9; color:var(--good);}
.pill.gym{background:#E8F3FC; color:#1F6FA8;}
.pill.match{background:#F9EBD8; color:#9A5B12;}
.pill.other{background:#EFE9E2; color:var(--muted);}
.empty{color:var(--muted); font-size:14px; padding:8px 0;}
table{width:100%; border-collapse:collapse; font-size:14px;}
th{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--muted); text-align:left; padding:6px 6px; border-bottom:2px solid var(--line);}
td{padding:7px 6px; border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.num{font-variant-numeric:tabular-nums; text-align:right;}
.tag-num{
  display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
  background:var(--maroon); color:var(--yellow); border-radius:6px;
  font-family:'Barlow Condensed'; font-weight:800; font-size:14px; margin-right:8px; flex:none;
}
.player-li{display:flex; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line);}
.player-li:last-child{border-bottom:none;}
.player-li .nm{font-weight:600;}
.player-li .pos{font-size:12px; color:var(--muted);}
.player-li.inactive .nm{color:var(--muted); text-decoration:line-through;}
.chk{width:22px; height:22px; accent-color:var(--maroon); flex:none;}
/* Bottom nav */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; background:var(--maroon-deep);
  display:flex; z-index:50; padding-bottom:env(safe-area-inset-bottom);
  border-top:3px solid var(--yellow);
}
nav.tabs button{
  flex:1; background:transparent; color:#C9A6AD; border-radius:0; padding:11px 2px 10px;
  font-size:13px; letter-spacing:.08em; display:flex; flex-direction:column; gap:2px; align-items:center;
}
nav.tabs button .ico{font-size:17px; line-height:1;}
nav.tabs button.on{color:var(--yellow);}
/* Scoreboard — the signature */
.board{
  background:var(--maroon-deep); border-radius:var(--radius); padding:16px 12px 14px; color:#fff;
  border:1px solid var(--maroon-line); margin-bottom:12px;
  background-image:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.12));
}
.board .teams{display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center;}
.board .tname{font-family:'Barlow Condensed'; font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:14px; color:#E7C6CE; text-align:center;}
.board .sc{
  font-family:'Barlow Condensed'; font-weight:800; font-size:44px; color:var(--yellow);
  text-align:center; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.03em;
}
.board .tot{font-size:13px; color:#DDB9C1; text-align:center; margin-top:2px; font-variant-numeric:tabular-nums;}
.board .vs{color:var(--sky); font-family:'Barlow Condensed'; font-weight:700; font-size:15px;}
.board .meta{display:flex; justify-content:center; gap:10px; margin-top:10px; align-items:center;}
.timer-box{text-align:center;}
.timer-clock{font-family:'Barlow Condensed'; font-weight:800; font-size:40px; color:var(--maroon); font-variant-numeric:tabular-nums; letter-spacing:.02em;}
.timer-box.over .timer-clock{color:var(--bad);}
.timer-sub{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
.avail-pill{border:1.5px solid var(--line); background:#fff; color:var(--muted);}
.avail-pill.avail-confirmed{background:#E4F2E9; color:var(--good); border-color:var(--good);}
.avail-pill.avail-doubtful{background:#FBF0D9; color:#9A5B12; border-color:#C98B1F;}
.avail-pill.avail-out{background:#F7E4E2; color:var(--bad); border-color:var(--bad);}
.halfbtn{background:transparent; border:1.5px solid var(--maroon-line); color:#E7C6CE; font-size:13px; padding:5px 12px; border-radius:99px;}
.halfbtn.on{background:var(--yellow); color:var(--maroon-deep); border-color:var(--yellow);}
.tpnote{text-align:center; font-size:12px; color:var(--sky); margin-top:6px;}
/* Score buttons */
.scorebtns{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.scorebtns button{padding:16px 4px; font-size:18px;}
.statgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.stat{
  background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  display:flex; align-items:center; justify-content:space-between;
}
.stat .lb{font-size:13px; font-weight:600;}
.stat .ct{font-family:'Barlow Condensed'; font-weight:800; font-size:22px; color:var(--maroon); min-width:24px; text-align:center;}
.stat .ops{display:flex; gap:4px; align-items:center;}
.stat .ops button{width:32px; height:32px; padding:0; font-size:18px; border-radius:8px;}
.stat .minus{background:var(--paper); color:var(--muted); border:1px solid var(--line);}
.stat .plus{background:var(--maroon); color:#fff;}
/* modal */
.overlay{position:fixed; inset:0; background:rgba(36,19,24,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--paper); width:100%; max-width:640px; max-height:80vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:16px 16px 24px;}
.sheet h3{margin:0 0 10px; text-transform:uppercase; color:var(--maroon); font-size:18px;}
.picker button{display:flex; width:100%; align-items:center; background:#fff; border:1px solid var(--line); margin-bottom:6px; text-align:left; font-family:'Barlow'; text-transform:none; letter-spacing:0; font-weight:600; font-size:15px; padding:10px;}
.picker button:active{background:#F0E8DE;}
.eventlog{font-size:13px; color:var(--muted); max-height:150px; overflow-y:auto;}
.eventlog div{padding:4px 0; border-bottom:1px dashed var(--line);}
.result-w{color:var(--good); font-weight:700;}
.result-l{color:var(--bad); font-weight:700;}
.result-d{color:var(--muted); font-weight:700;}
.hist-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.savebar{font-size:11px; color:var(--muted); text-align:center; padding:4px 0 0;}
.seg{display:flex; gap:6px; margin-bottom:10px;}
.seg button{flex:1; background:#fff; border:1.5px solid var(--line); color:var(--muted); font-size:14px; padding:8px 4px;}
.seg button.on{background:var(--maroon); color:#fff; border-color:var(--maroon);}
.delta-up{color:var(--good); font-weight:700;}
.delta-dn{color:var(--bad); font-weight:700;}
</style>
</head>

<script>
/* ================= DATA ================= */
const KEY='gnm-feile-squad';
let DB={players:[], sessions:[], tests:[], matches:[], live:null};
let storageOK=true;
const uid=()=>Math.random().toString(36).slice(2,10);
/* Gort na Móna U16 panel — seeded on first run only */
const SEED=[
'Kaila Walsh',
'Seana Fryers',
'Ella Hughes',
'Niamh Keenan',
'Casey McKeown',
'Holly McKeaveny',
'Holly-Mae Magill',
'Grace Kearney',
'Abbie Lennon',
'Meabh Maguire',
'Clara McKenna',
'Alexia Largey',
'Siana Ward',
'Laura Lyons',
'Mayla Thompson',
'Carly Muckian',
'Ruby Manning',
'Ciara McConnell',
'Eloise McAuley',
'Jessie McGeown',
'Sophie O\'Hanlon',
'Evie Magee McKenna',
'Aoife Mackel',
'Cara Malone',
'Holly Donaghy',
'Cadhla Stilgies'
].map(n=>({id:uid(), name:n, num:null, pos:'', active:true}));
/* local date, not UTC — toISOString() gives yesterday's date after midnight during Irish summer time */
const today=()=>{const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const DEFAULT_HALF=30;
const fmtDate=d=>{try{return new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}};

async function storGet(){
  /* phone/browser first, Claude artifact storage as fallback */
  try{ const v=localStorage.getItem(KEY); if(v) return v; }catch(e){}
  try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value) return r.value; } }catch(e){}
  return null;
}
async function storSet(v){
  let ok=false;
  try{ localStorage.setItem(KEY, v); ok=true; }catch(e){}
  try{ if(window.storage){ await window.storage.set(KEY, v); ok=true; } }catch(e){}
  return ok;
}
async function load(){
  const v=await storGet();
  let found=false;
  if(v){ try{ DB=Object.assign(DB, JSON.parse(v)); found=true; }catch(e){} }
  if(!found || !DB.players.length){ DB.players=SEED; save(); }
  if(DB.settings && DB.settings.sideline) document.body.classList.add('sideline');
  /* live-match events need ids to sync one by one (older saves didn't have them) */
  if(DB.live) DB.live.events.forEach(e=>{ if(!e.id) e.id=uid(); });
  render();
  connectShared();
}
let saveTimer=null;
async function flushSave(){
  clearTimeout(saveTimer); saveTimer=null;
  storageOK=await storSet(JSON.stringify(DB));
  pushShared();
  updateSyncBar();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave, 250);
}
/* write immediately if the phone is locked or the app is swiped away mid-debounce,
   so the last score tapped before pocketing the phone isn't lost */
const flushIfPending=()=>{ if(saveTimer) flushSave(); };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushIfPending(); });
window.addEventListener('pagehide', flushIfPending);
/* ask the browser not to evict our data when the phone is low on space */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }catch(e){} }

/* keep the screen awake while a match is live, so the clock and buttons are
   there when you glance down — the browser drops the lock when the app is
   backgrounded, so it's re-requested on return */
let wakeLock=null;
async function syncWakeLock(){
  const want= !!DB.live && document.visibilityState==='visible';
  try{
    if(want && !wakeLock && navigator.wakeLock){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{ wakeLock=null; });
    } else if(!want && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange', syncWakeLock);

/* ================= SHARED SQUAD (coaches) =================
   When the app is opened as a claude.ai artifact shared with the other
   coaches, everything syncs live through the artifact's database. Each
   player, session, test, saved match and live-match event is its own
   document, so two coaches logging at the same time don't overwrite each
   other. Opened anywhere else (the installed phone app) none of this runs
   and the app works from this device's storage exactly as before; this
   device's copy is also kept as an offline cache in shared mode.
   SYNC.state: off | connecting | empty (shared squad has no data yet) |
   live | readonly (view-only access) | error */
const SYNC={state:'off', db:null, remote:{}, synced:{}, ready:new Set(), pending:new Map(), inflight:new Set(), deferred:false};
const SHARED_COLLECTIONS=['players','sessions','tests','matches','liveEvents'];
const clean=o=>JSON.parse(JSON.stringify(o));
/* the app's data as {docPath: body} */
function docsOf(D){
  const out={};
  D.players.forEach(p=>out['players/'+p.id]=p);
  D.sessions.forEach(x=>out['sessions/'+x.id]=x);
  D.tests.forEach(x=>out['tests/'+x.id]=x);
  D.matches.forEach(x=>out['matches/'+x.id]=x);
  if(D.live){
    const {events, ...meta}=D.live;
    out['live/current']=meta;
    events.forEach(e=>out['liveEvents/'+e.id]=e);
  }
  return out;
}
function dbFromDocs(docs){
  const D={players:[], sessions:[], tests:[], matches:[], live:null, settings:DB.settings};
  const events=[];
  Object.entries(docs).forEach(([path,v])=>{
    const col=path.split('/')[0];
    if(col==='liveEvents') events.push(v);
    else if(col==='live') D.live={...v};
    else if(D[col]) D[col].push(v);
  });
  if(D.live) D.live.events=events.sort((a,b)=>a.t-b.t);
  return D;
}
function syncReady(){ return SYNC.ready.size===SHARED_COLLECTIONS.length+1; }
async function connectShared(){
  if(!window.claude || !window.claude.use) return;
  SYNC.state='connecting'; updateSyncBar();
  const db=await window.claude.use('db');
  if(!db){ SYNC.state='off'; updateSyncBar(); return; }
  SYNC.db=db;
  try{
    const user=await window.claude.use('user');
    if(user && (await user.can('data.write'))===false) SYNC.readonly=true;
  }catch(e){}
  const fail=e=>{ SYNC.state='error'; SYNC.error=(e&&e.message)||'Connection lost'; updateSyncBar(); };
  SHARED_COLLECTIONS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      Object.keys(SYNC.remote).forEach(k=>{ if(k.startsWith(col+'/')) delete SYNC.remote[k]; });
      snap.docs.forEach(d=>{ SYNC.remote[col+'/'+d.id]=d.data(); });
      SYNC.ready.add(col); onRemote();
    }, fail);
  });
  db.doc('live/current').onSnapshot(snap=>{
    if(snap.exists) SYNC.remote['live/current']=snap.data(); else delete SYNC.remote['live/current'];
    SYNC.ready.add('live'); onRemote();
  }, fail);
}
/* first full picture: adopt the shared squad (or offer to fill an empty one);
   after that, fold in only what other coaches changed */
function onRemote(){
  if(!syncReady()) return;
  if(SYNC.state==='connecting'){
    if(!Object.keys(SYNC.remote).length){ SYNC.state=SYNC.readonly?'readonly':'empty'; render({keep:true}); return; }
    SYNC.synced={};
    Object.entries(SYNC.remote).forEach(([k,v])=>SYNC.synced[k]=JSON.stringify(v));
    DB=dbFromDocs(clean(SYNC.remote));
    SYNC.state=SYNC.readonly?'readonly':'live';
    storSet(JSON.stringify(DB)); redraw(); return;
  }
  if(SYNC.state==='empty' && Object.keys(SYNC.remote).length){
    /* another coach filled it first — switch over to theirs */
    SYNC.state='connecting'; onRemote(); return;
  }
  if(SYNC.state!=='live' && SYNC.state!=='readonly') return;
  const local=docsOf(DB);
  let changed=false;
  const paths=new Set([...Object.keys(SYNC.remote), ...Object.keys(SYNC.synced)]);
  paths.forEach(p=>{
    const r=SYNC.remote[p], rj= r===undefined? undefined : JSON.stringify(r);
    if(rj===SYNC.synced[p]) return;  /* nobody else touched it */
    if(SYNC.pending.has(p)||SYNC.inflight.has(p)) return; /* our own write is on its way */
    if(r===undefined){ delete local[p]; delete SYNC.synced[p]; }
    else { local[p]=clean(r); SYNC.synced[p]=rj; }
    changed=true;
  });
  if(!changed) return;
  DB=dbFromDocs(local);
  storSet(JSON.stringify(DB)); redraw();
}
/* redraw for a remote change without wiping a half-filled form or an open picker */
function redraw(){
  if(document.getElementById('modal-root').innerHTML){ SYNC.deferred=true; return; }
  render({keep:true});
}
/* send this device's changes: every doc whose body differs from what was last synced */
function pushShared(){
  if(SYNC.state!=='live' || !SYNC.db) return;
  const local=docsOf(DB);
  Object.entries(local).forEach(([p,v])=>{
    const j=JSON.stringify(v);
    if(SYNC.synced[p]!==j){ SYNC.synced[p]=j; SYNC.pending.set(p, clean(v)); }
  });
  Object.keys(SYNC.synced).forEach(p=>{
    if(!(p in local)){ delete SYNC.synced[p]; SYNC.pending.set(p, null); }
  });
  pumpShared();
}
/* a few writes at a time, never two to the same document at once */
function pumpShared(){
  while(SYNC.inflight.size<4){
    const p=[...SYNC.pending.keys()].find(k=>!SYNC.inflight.has(k));
    if(!p) break;
    const v=SYNC.pending.get(p); SYNC.pending.delete(p); SYNC.inflight.add(p);
    const ref=SYNC.db.doc(p);
    (v===null? ref.delete() : ref.set(v)).catch(e=>{
      const code=e&&e.code;
      if(code==='unavailable'||code==='resource_exhausted'){
        if(!SYNC.pending.has(p)) setTimeout(()=>{ if(!SYNC.pending.has(p)){ SYNC.pending.set(p,v); pumpShared(); } }, 1500+Math.random()*1500);
      } else if(code==='invalid_argument' && SYNC.state==='live'){
        SYNC.readonly=true; SYNC.state='readonly';
      } else if(code==='quota_exceeded'){
        SYNC.error='Shared storage is full'; notify('Shared storage is full', 'This change was saved on this device only. Delete old test results or matches to make room.');
      } else { SYNC.state='error'; SYNC.error=(e&&e.message)||'Sync failed'; }
    }).finally(()=>{ SYNC.inflight.delete(p); pumpShared(); updateSyncBar(); });
  }
  updateSyncBar();
}
/* first coach in: put this device's squad into the empty shared store */
function adoptShared(){
  SYNC.state='live'; SYNC.synced={};
  pushShared(); render();
}
function syncLabel(){
  const n=SYNC.pending.size+SYNC.inflight.size;
  return {

}

/* ================= MATCH TIMER =================
   Persists as a timestamp + accumulated-ms pair (not a naive interval counter),
   so it stays accurate through phone locks or a page reload mid-match. */
function timerElapsedMs(t, nowMs){
  if(!t) return 0;
  if(t.running && t.startedAt!=null) return t.accumMs + (nowMs - t.startedAt);
  return t.accumMs||0;
}
function timerFmt(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const m=Math.floor(s/60), ss=s%60;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}
function timerStart(t){ return {...t, running:true, startedAt:Date.now()}; }
function timerPause(t){ return {...t, running:false, startedAt:null, accumMs:timerElapsedMs(t,Date.now())}; }
function timerReset(halfLenMin){ return {running:false, startedAt:null, accumMs:0, halfLen:halfLenMin||DEFAULT_HALF}; }
/* Auto-start the match clock the moment anything gets logged, in case the
   coach forgets to press Start — only kicks in if a timer exists and isn't
   already running, so it never overrides a deliberate pause. */
function ensureTimerRunning(){
  if(DB.live && DB.live.timer && !DB.live.timer.running){
    DB.live.timer=timerStart(DB.live.timer);
  }
}
/* push a live-match event stamped with the half and the minute of that half
   (1-based, like a referee's watch: 0:00–0:59 is the 1st minute) */
function logEvent(ev){
  ensureTimerRunning();
  const sec=Math.floor(timerElapsedMs(DB.live.timer, Date.now())/1000);
  DB.live.events.push({id:uid(), t:Date.now(), half:DB.live.half, min:Math.floor(sec/60)+1, sec, ...ev});
}
/* remember how long a half actually ran (injury time included) for game-time totals */
function recordHalfLength(L){
  const sec=Math.floor(timerElapsedMs(L.timer, Date.now())/1000);
  if(sec>0) L.halfSecs={...(L.halfSecs||{}), [L.half]:sec};
}

/* ================= GAME TIME =================
   Minutes on the pitch per player for one match: starters from throw-in,
   then each sub swaps the clock over. `nowSec` (seconds into the current
   half) is passed for a live match; a saved match runs to full time.
   Returns null for older matches whose subs weren't timed. */
function gameTime(m, nowSec){
  const subs=m.events.filter(e=>e.type==='sub');
  if(subs.some(e=>e.sec==null && e.min==null)) return null;
  const halfLen=((m.timer&&m.timer.halfLen)||DEFAULT_HALF)*60;
  const len=h=> (m.halfSecs&&m.halfSecs[h]) || halfLen;
  const at=(half,sec)=> (half===2? len(1) : 0) + sec;
  const evSec=e=> e.sec!=null? e.sec : (e.min-1)*60;
  /* a match saved without ever switching to the 2nd half ran on one clock */
  const end= nowSec!=null? at(m.half, nowSec) : len(1) + (m.half===2? len(2) : 0);
  const mins={}, onSince={};
  (m.lineup||[]).forEach(id=>{ onSince[id]=0; });
  subs.forEach(e=>{
    const t=Math.min(at(e.half, evSec(e)), end);
    if(e.off in onSince){ mins[e.off]=(mins[e.off]||0)+(t-onSince[e.off]); delete onSince[e.off]; }
    if(e.on && !(e.on in onSince)) onSince[e.on]=t;
  });
  Object.entries(onSince).forEach(([id,t0])=>{ mins[id]=(mins[id]||0)+Math.max(0,end-t0); });
  Object.keys(mins).forEach(id=>{ mins[id]=Math.round(mins[id]/60); });
  return mins;
}
/* season game time per player across every timed match */
function seasonGameTime(){
  const tot={}; let untimed=0;
  DB.matches.forEach(m=>{
    const g=gameTime(m);
    if(!g){ untimed++; return; }
    Object.entries(g).forEach(([id,n])=>{
      tot[id]=tot[id]||{mins:0, apps:0};
      tot[id].mins+=n; tot[id].apps++;
    });
  });
  return {tot, untimed};
}
/* every active player, including any with no minutes yet — empty if no match was timed */
function gameTimeRows(gt){
  if(DB.matches.length<=gt.untimed) return [];
  return activePlayers().map(p=>({name:p.name, ...(gt.tot[p.id]||{mins:0,apps:0})}))
    .sort((a,b)=>b.mins-a.mins || a.name.localeCompare(b.name));
}
function minutesLine(m){
  const g=gameTime(m);
  if(!g) return '';
  const list=Object.entries(g).sort((a,b)=>b[1]-a[1]);
  return `<b>Minutes:</b> ${list.map(([id,n])=>`${esc(playerName(id))} ${n}'`).join(', ')}<br>`;
}
const evWhen=e=>`H${e.half}${e.min?` ${e.min}'`:''}`;
function renderTimer(t){
  const elapsed=timerElapsedMs(t, Date.now());
  const halfMs=(t.halfLen||DEFAULT_HALF)*60*1000;
  const remaining=halfMs-elapsed;
  const over=remaining<0;
  return `
  <div class="timer-box ${over?'over':''}">

function scoreOf(events, team){
  let g=0,p1=0,p2=0;
  events.forEach(e=>{
    if(e.team!==team) return;
    if(e.type==='goal') g++;
    else if(e.type==='point1') p1++;
    else if(e.type==='point2') p2++;
  });
  const pts=p1+2*p2;
  return {g,p1,p2,pts,total:3*g+pts,disp:`${g}-${String(pts).padStart(2,'0')}`};
}

/* inside a claude.ai artifact, plain download links and the print dialog are
   blocked; files go through the viewer's own save prompt instead */
const IN_ARTIFACT=!!(window.claude && window.claude.use);
async function saveFile(filename, text, type){
  if(IN_ARTIFACT){
    const dl=await window.claude.use('downloads');
    if(!dl){ notify('Saving files is not available here', 'Use "Copy sync code" instead, or open the app on your phone.'); return false; }
    try{ await dl.save({filename, data:new Blob([text],{type})}); return true; }
    catch(e){ if(e&&e.code!=='declined') notify('File not saved', (e&&e.message)||''); return false; }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  return true;
}

  if(await saveFile(`gnm-u16-backup-${today()}.json`, JSON.stringify(DB,null,1), 'application/json')) markBackedUp();

/* sync code: same data as a backup file, just base64-encoded text instead of a
   file download — quicker to move between two devices via clipboard + any
   messaging app the user already has open, no file picker needed */
function encodeSyncCode(){
  const json=JSON.stringify(DB);
  return 'GNM1:'+btoa(unescape(encodeURIComponent(json)));
}
function decodeSyncCode(code){
  const c=code.trim();
  if(!c.startsWith('GNM1:')) throw new Error('Not a recognised sync code');
  const json=decodeURIComponent(escape(atob(c.slice(5))));
  const d=JSON.parse(json);
  if(!d.players) throw new Error('Not a recognised sync code');
  return d;
}

/* Printable season report — built into a hidden #print-report div, shown only
   via the @media print rules, then handed to the browser's own Print dialog
   (Save as PDF works the same way) so there's no PDF library dependency. */
function buildSeasonReportHTML(){
  const logoSrc=(document.querySelector('header.app img')||{}).src||'';
  const totalSessions=DB.sessions.length;
  const attRows=activePlayers().map(p=>({name:p.name, num:p.num, ...attendance(p, null)})).sort(byPct);

  const tally={};
  DB.matches.forEach(m=>m.events.forEach(e=>{
    if(e.team!=='us'||!['goal','point1','point2'].includes(e.type))return;
    const k=e.playerId||'__team';
    tally[k]=tally[k]||{g:0,p1:0,p2:0};
    if(e.type==='goal')tally[k].g++; if(e.type==='point1')tally[k].p1++; if(e.type==='point2')tally[k].p2++;
  }));
  const scorerRows=Object.entries(tally).map(([id,t])=>({
    name:id==='__team'?'(unattributed)':playerName(id), ...t, total:3*t.g+t.p1+2*t.p2
  })).sort((a,b)=>b.total-a.total);

  const matchRows=DB.matches.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>{
    const us=scoreOf(m.events,'us'), th=scoreOf(m.events,'them');
    const res= us.total>th.total?'W':us.total<th.total?'L':'D';
    return {date:fmtDate(m.date), comp:m.comp, opp:m.opponent, score:`${us.disp} : ${th.disp}`, res};
  });
  const record={W:0,L:0,D:0};
  matchRows.forEach(r=>record[r.res]++);

  const gt=seasonGameTime(), gtRows=gameTimeRows(gt);

  // first and most recent result per test, like the coach guide's results sheet
  const testTypes=testColumns();
  const testRows=activePlayers().map(p=>({name:p.name, cells:testTypes.map(t=>firstLatest(p.id,t))}))
    .filter(r=>r.cells.some(Boolean));

  return `
    ${logoSrc?`<img class="rep-logo" src="${logoSrc}">`:''}
    <h1>Gort na Móna LGFA — U16 Season Report</h1>
    <div class="rep-sub">Generated ${fmtDate(today())} · Record: ${record.W}W ${record.D}D ${record.L}L from ${matchRows.length} matches</div>
    <div style="clear:both"></div>

    <h2>Squad Attendance (${totalSessions} sessions logged)</h2>
    <table><tr><th>No.</th><th>Player</th><th>Sessions</th><th>%</th></tr>
    ${attRows.map(r=>`<tr><td>${esc(r.num||'')}</td><td>${esc(r.name)}</td><td>${r.att}/${r.total}</td><td>${pctCell(r.pct)}</td></tr>`).join('')}
    </table>

    <h2>Match Results</h2>
    <table><tr><th>Date</th><th>Competition</th><th>Opposition</th><th>Score</th><th>Result</th></tr>
    ${matchRows.map(r=>`<tr><td>${r.date}</td><td>${esc(r.comp)}</td><td>${esc(r.opp)}</td><td>${r.score}</td><td>${r.res}</td></tr>`).join('') || '<tr><td colspan="5">No matches recorded</td></tr>'}
    </table>

    <h2>Season Scorers</h2>
    <table><tr><th>Player</th><th>Goals</th><th>Points</th><th>2-Pointers</th><th>Total</th></tr>
    ${scorerRows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.g}</td><td>${r.p1}</td><td>${r.p2}</td><td>${r.total}</td></tr>`).join('') || '<tr><td colspan="5">No scores recorded</td></tr>'}
    </table>

    ${gtRows.length? `<h2>Game Time${gt.untimed?` (${gt.untimed} untimed match${gt.untimed===1?'':'es'} not counted)`:''}</h2>
    <table><tr><th>Player</th><th>Appearances</th><th>Minutes</th><th>Avg / match</th></tr>
    ${gtRows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.apps}</td><td>${r.mins}</td><td>${r.apps?Math.round(r.mins/r.apps):'—'}</td></tr>`).join('')}
    </table>`:''}

    ${testRows.length? `<h2>Fitness Testing (first → latest)</h2>
    <table><tr><th>Player</th>${testTypes.map(t=>`<th>${esc(t)}</th>`).join('')}</tr>
    ${testRows.map(r=>`<tr><td>${esc(r.name)}</td>${r.cells.map((fl,i)=>`<td>${firstLatestCell(fl,testTypes[i])}</td>`).join('')}</tr>`).join('')}
    </table>`:''}
  `;
}

/* ================= SESSIONS ================= */
/* Attendance over sessions since `since` (YYYY-MM-DD, or null for the season).
   Sessions before a player joined the panel don't count against her, unless
   she was ticked at one anyway. pct is null when there's nothing to count. */
function attendance(p, since){
  const ss=DB.sessions.filter(s=> (!since||s.date>=since) && (!p.joined||s.date>=p.joined||s.present.includes(p.id)));
  const att=ss.filter(s=>s.present.includes(p.id)).length;
  return {att, total:ss.length, pct: ss.length? Math.round(att/ss.length*100) : null};
}
const byPct=(a,b)=>(b.pct??-1)-(a.pct??-1);
const pctCell=pct=> pct===null? '—' : `${pct}%`;
const pctColor=pct=> pct===null? 'var(--muted)' : pct>=70? 'var(--good)' : 'var(--bad)';
const ATT_PERIODS={season:['Season',null], w8:['8 weeks',56], w4:['4 weeks',28]};
function periodStart(key){
  const days=ATT_PERIODS[key][1];
  if(!days) return null;
  const d=new Date(); d.setDate(d.getDate()-days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

            <span class="tag-num">${esc(p.num)||'–'}</span><span class="nm">${esc(p.name)}</span>
          </label>
        </div>`).join('') || '<div class="empty">Add players in the Squad tab first.</div>'}
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn-ghost grow" data-act="sess-all">Tick all</button>
      <button class="btn-p grow" data-act="save-session">${editing?'Update session':'Save session'}</button>

    `).join('') || '<div class="empty">Nothing yet.</div>'}

}

/* ================= LEVELS ================= */
let lvlPlayer='', lvlTest='0';
/* results typed on the Test Day list, kept while switching between tests until saved */
const testDraft={};
const draftVal=id=>esc(testDraft[id]||'');
/* every player's first and most recent result for one test (null if none) */
function firstLatest(pid, test){
  const arr=DB.tests.filter(e=>e.playerId===pid && e.test===test).sort((a,b)=>a.date.localeCompare(b.date));
  return arr.length? {first:arr[0], latest:arr[arr.length-1], n:arr.length} : null;
}
/* the guide's tests first, then any other test that has results (older or custom ones) */
function testColumns(){
  const used=new Set(DB.tests.map(t=>t.test));
  return [...TESTS.map(t=>t.name).filter(n=>used.has(n)), ...[...used].filter(n=>!TESTS.some(t=>t.name===n))];
}
/* "2.85 → 2.71" coloured by whether she improved on her own first result */
function firstLatestCell(fl, test){
  if(!fl) return '—';
  if(fl.n===1) return esc(fmtResult(fl.first));
  const d=fl.latest.value-fl.first.value;
  const cls= d===0? '' : ((LOWER_BETTER(test)? d<0 : d>0)? 'delta-up':'delta-dn');
  return `${esc(fmtResult(fl.first))} → <span class="${cls}">${esc(fmtResult(fl.latest))}</span>`;
}
function viewLevels(){
  const ps=activePlayers().sort(byNum);
  if(!lvlPlayer && ps.length) lvlPlayer=ps[0].id;
  const custom= lvlTest==='__c';
  const def= custom? null : TESTS[+lvlTest];
  const bleep= !!(def && def.bleep);
  const key= custom? 'c' : lvlTest;
  const unit= def? (def.unit||'') : '';
  const entryRow=p=>`
    <div class="player-li" style="gap:8px">
      <span class="tag-num">${esc(p.num)||'–'}</span><span class="nm grow" style="min-width:0">${esc(p.name)}</span>
      ${bleep
        ? `<input id="lv-b-${p.id}-l" class="lv-entry" value="${draftVal(`lv-b-${p.id}-l`)}" type="number" min="1" max="21" inputmode="numeric" placeholder="Lvl" style="width:64px" aria-label="${esc(p.name)} level">
           <input id="lv-b-${p.id}-s" class="lv-entry" value="${draftVal(`lv-b-${p.id}-s`)}" type="number" min="1" max="16" inputmode="numeric" placeholder="Sh" style="width:64px" aria-label="${esc(p.name)} shuttle">`
        : `<input id="lv-${key}-${p.id}" class="lv-entry" value="${draftVal(`lv-${key}-${p.id}`)}" type="number" step="0.01" inputmode="decimal" placeholder="${esc(unit)}" style="width:96px" aria-label="${esc(p.name)} result">`}
    </div>`;
  const entries=DB.tests.filter(t=>t.playerId===lvlPlayer).sort((a,b)=>a.date.localeCompare(b.date));
  const byTest={};
  entries.forEach(e=>{(byTest[e.test]=byTest[e.test]||[]).push(e);});
  const cols=testColumns();
  return `
  <div class="card">
    <h2>Test Day</h2>
    <div style="font-size:13px;color:var(--muted);margin-bottom:4px">${TEST_DAYS.map(d=>`${d.label}: <b>${fmtDate(d.date)}</b>`).join(' · ')}. Same tests, same order, same surface both times. Bleep test last.</div>
    <label class="f">Test</label>
    <select id="lv-test">${TESTS.map((t,i)=>`<option value="${i}" ${String(i)===lvlTest?'selected':''}>${esc(t.name)}</option>`).join('')}<option value="__c" ${custom?'selected':''}>Custom…</option></select>
    <input id="lv-custom" placeholder="Custom test name" style="display:${custom?'block':'none'};margin-top:6px">
    ${def? `<div style="font-size:13px;color:var(--muted);margin-top:6px">${esc(def.hint)}</div>`:''}
    <label class="f">Date</label><input id="lv-date" type="date" value="${today()}">
    <label class="f">Results — fill in whoever did the test, leave the rest blank</label>
    ${ps.map(entryRow).join('') || '<div class="empty">Add players in the Squad tab first.</div>'}
    <div style="margin-top:10px"><button class="btn-p btn-block" data-act="save-tests">Save results</button></div>
  </div>
  <div class="card">
    <h2>Squad Results</h2>
    ${cols.length? `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">First result → latest. Green means better than her own first test.</div>
    <div style="overflow-x:auto"><table><tr><th>Player</th>${cols.map(t=>`<th>${esc(t)}</th>`).join('')}</tr>
    ${ps.map(p=>`<tr><td style="white-space:nowrap">${esc(p.name)}</td>${cols.map(t=>`<td style="white-space:nowrap">${firstLatestCell(firstLatest(p.id,t),t)}</td>`).join('')}</tr>`).join('')}
    </table></div>` : `<div class="empty">No results yet. The baseline is on ${fmtDate(TEST_DAYS[0].date)}.</div>`}
  </div>
  <div class="card">
    <h2>Player Progress</h2>
    <select id="lv-player">${ps.map(p=>`<option value="${p.id}" ${p.id===lvlPlayer?'selected':''}>${esc(p.num||'')} ${esc(p.name)}</option>`).join('')}</select>
    ${Object.keys(byTest).length? Object.entries(byTest).map(([t,arr])=>{
      const first=arr[0], last=arr[arr.length-1];
      const d=last.value-first.value;
      const improved= LOWER_BETTER(t)? d<0 : d>0;
      const cls= d===0? '' : (improved?'delta-up':'delta-dn');
      const change= isBleep(t)
        ? `${esc(fmtResult(first))} → <span class="${cls}">${esc(fmtResult(last))}</span> (${d===0?'same':improved?'better':'worse'})`
        : `<span class="${cls}">${d>0?'+':''}${Math.round(d*100)/100}</span>`;
      return `<h3>${esc(t)}</h3>
      <table><tr><th>Date</th><th class="num">Result</th><th></th></tr>
      ${arr.map(e=>`<tr><td>${fmtDate(e.date)}</td><td class="num">${esc(fmtResult(e))}</td><td style="width:34px;text-align:right"><button class="btn-sm btn-danger" style="padding:2px 8px" data-act="del-test" data-id="${e.id}">✕</button></td></tr>`).join('')}
      </table>
      ${arr.length>1? `<div style="font-size:13px;margin:4px 0 8px">Change since first test: ${change}</div>`:''}`;
    }).join('') : `<div class="empty">No results logged for this player yet.</div>`}
  </div>`;
}

let showGT=false;
function evLabel(e){

/* chronological play-by-play, in the order events were recorded during the match */
function matchTimeline(m){
  const S={us:{g:0,p1:0,p2:0}, them:{g:0,p1:0,p2:0}};
  const runningScore=()=>{
    const u=S.us, t=S.them;
    return `${u.g}-${String(u.p1+2*u.p2).padStart(2,'0')} : ${t.g}-${String(t.p1+2*t.p2).padStart(2,'0')}`;
  };
  const lab={goal:'Goal',point1:'Point',point2:'Two-pointer',wide:'Wide',
    ko_won:'Kickout won',ko_lost:'Kickout lost',ko_mark:'Kickout mark',
    turnover:'Turnover won',free_won:'Free won',free_con:'Free conceded'};
  return m.events.map(e=>{
    if(e.type==='sub') return `${evWhen(e)}  🔁 Sub: ${playerName(e.on)} on for ${playerName(e.off)}`;
    if(['goal','point1','point2'].includes(e.type)){
      const side= e.team==='us'? S.us : S.them;
      if(e.type==='goal')side.g++; else if(e.type==='point1')side.p1++; else side.p2++;
      if(e.team==='us'){
        const who=e.playerId? playerName(e.playerId) : 'Team';
        return `${evWhen(e)}  ⚽ ${lab[e.type]}: ${who}  (${runningScore()})`;
      }
      return `${evWhen(e)}  ${lab[e.type]} conceded  (${runningScore()})`;
    }
    if(e.team==='us') return `${evWhen(e)}  ${lab[e.type]||e.type}`;
    return null; // opposition non-scoring events aren't tracked, nothing to show
  }).filter(Boolean).join('\n');
}

/* WhatsApp-ready match report */
function matchSummary(m){
  const us=scoreOf(m.events,'us'), th=scoreOf(m.events,'them');
  const res= us.total>th.total?'WIN':us.total<th.total?'LOSS':'DRAW';
  const sc={};
  m.events.forEach(e=>{ if(e.team==='us'&&['goal','point1','point2'].includes(e.type)){
    const k=e.playerId||'__t'; sc[k]=sc[k]||{g:0,p:0,p2:0};
    if(e.type==='goal')sc[k].g++; else {sc[k].p+=(e.type==='point2'?2:1); if(e.type==='point2')sc[k].p2++;}}});
  const scorers=Object.entries(sc).sort((a,b)=>(3*b[1].g+b[1].p)-(3*a[1].g+a[1].p))
    .map(([k,s])=>`${k==='__t'?'Team':playerName(k)} ${s.g}-${String(s.p).padStart(2,'0')}${s.p2?` (${s.p2}×2pt)`:''}`).join(', ');
  const subs=m.events.filter(e=>e.type==='sub')
    .map(e=>`${playerName(e.on)} for ${playerName(e.off)}`).join(', ');
  /* everyone who played: starting lineup + anyone subbed on */
  const started=(m.lineup||[]).map(id=>DB.players.find(p=>p.id===id)).filter(Boolean).sort(byAttack);
  const cameOn=[...new Set(m.events.filter(e=>e.type==='sub').map(e=>e.on))]
    .filter(id=>!(m.lineup||[]).includes(id))
    .map(id=>DB.players.find(p=>p.id===id)).filter(Boolean);
  const nameNum=p=>`${p.num? p.num+'. ':''}${p.name}`;
  const teamBlock=`Team: ${started.map(nameNum).join(', ')||'—'}${cameOn.length? `\nCame on: ${cameOn.map(nameNum).join(', ')}`:''}`;
  const c=t=>m.events.filter(e=>e.type===t).length;
  const shots=us.g+us.p1+us.p2+c('wide');
  const acc= shots? Math.round((us.g+us.p1+us.p2)/shots*100) : 0;
  const timeline=matchTimeline(m);
  return `🏐 ${m.comp} — ${fmtDate(m.date)}
Gort na Móna ${us.disp} (${us.total})  v  ${th.disp} (${th.total}) ${m.opponent}
Result: ${res}

⏱ MATCH TIMELINE
${timeline||'No events recorded.'}

📋 SUMMARY
${teamBlock}

Scorers: ${scorers||'—'}
${subs? `Subs: ${subs}\n`:''}Shooting: ${acc}% (${c('wide')} wides)
Kickouts: won ${c('ko_won')}, lost ${c('ko_lost')}, marks ${c('ko_mark')}
Turnovers won: ${c('turnover')} · Frees: won ${c('free_won')}, conceded ${c('free_con')}

Maith sibh a chailíní! 🟤🟡`;
}
function copyText(txt, btn){
  const orig=btn&&btn.textContent;
  const done=()=>{ if(btn){btn.textContent='Copied ✓'; setTimeout(()=>{btn.textContent=orig;},1500);} };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  if(ok) done(); else showSheet(`<h3>Copy this</h3><textarea rows="10" style="width:100%;font-size:13px;padding:8px;border:1.5px solid var(--line);border-radius:8px" readonly>${esc(txt)}</textarea>`);
  document.body.removeChild(ta);
}

/* ================= SHEET / MODAL =================
   In-app dialogs instead of the browser's confirm()/prompt()/alert(): those
   are blocked inside a claude.ai artifact (confirm() just answers "no"), and
   these match the rest of the app on the phone too. */
function ask(title, msg, ok='OK', danger=false){
  return new Promise(res=>{
    showSheet(`<h3>${esc(title)}</h3>${msg?`<p style="margin:0 0 12px;font-size:15px">${esc(msg)}</p>`:''}
      <button class="${danger?'btn-danger':'btn-p'} btn-block" id="ask-ok">${esc(ok)}</button>`, root=>{
      sheetOnClose=()=>res(false);
      root.querySelector('#ask-ok').onclick=()=>{ sheetOnClose=null; closeSheet(); res(true); };
    });
  });
}
function askText(title, value, inputmode='text'){
  return new Promise(res=>{
    showSheet(`<h3>${esc(title)}</h3>
      <input id="ask-val" inputmode="${inputmode}" value="${esc(value)}">
      <button class="btn-p btn-block" style="margin-top:10px" id="ask-ok">Save</button>`, root=>{
      sheetOnClose=()=>res(null);
      const inp=root.querySelector('#ask-val'); inp.focus(); inp.select();
      const done=()=>{ sheetOnClose=null; const v=inp.value; closeSheet(); res(v); };
      root.querySelector('#ask-ok').onclick=done;
      inp.onkeydown=e=>{ if(e.key==='Enter') done(); };
    });
  });
}
function notify(title, msg){
  showSheet(`<h3>${esc(title)}</h3>${msg?`<p style="margin:0;font-size:15px">${esc(msg)}</p>`:''}`);
  document.getElementById('sheet-close').textContent='OK';
}
/* runs when a sheet is dismissed (Cancel, tap outside, or replaced by another) */
let sheetOnClose=null;
function showSheet(html, after){
  const prev=sheetOnClose; sheetOnClose=null; if(prev) prev();
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="overlay" id="ov"><div class="sheet">${html}
    <button class="btn-ghost btn-block" style="margin-top:6px" id="sheet-close">Cancel</button></div></div>`;
  document.getElementById('sheet-close').onclick=closeSheet;
  document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeSheet();};
  if(after) after(root);
}
function closeSheet(){
  document.getElementById('modal-root').innerHTML='';
  const f=sheetOnClose; sheetOnClose=null; if(f) f();
  /* a remote change arrived while the picker was open — draw it now */
  if(SYNC.deferred){ SYNC.deferred=false; render({keep:true}); }
}

async function handle(d, el){
  const a=d.act;
  if(a==='add-player'){
    const name=document.getElementById('np-name').value.trim();
    if(!name) return;
    DB.players.push({id:uid(), name, num:+document.getElementById('np-num').value||null,
      pos:document.getElementById('np-pos').value, active:true, joined:today()});
    save(); render();
  }
  if(a==='export-data'){doExport();}
  if(a==='adopt-shared'){ if(await ask('Share this squad?', `${activePlayers().length} active players, ${DB.sessions.length} sessions and ${DB.matches.length} matches go up to the shared copy for every coach.`, 'Share with coaches')) adoptShared(); }
  if(a==='toggle-sideline'){
    DB.settings=DB.settings||{};
    DB.settings.sideline=!DB.settings.sideline;
    document.body.classList.toggle('sideline', DB.settings.sideline);
    save(); render();
  }
  if(a==='copy-sync'){ markBackedUp(); copyText(encodeSyncCode(), el); }
  if(a==='print-report' && IN_ARTIFACT){ saveFile(`gnm-u16-season-report-${today()}.html`, seasonReportFile(), 'text/html'); return; }
  if(a==='print-report'){
    document.getElementById('print-report').innerHTML=buildSeasonReportHTML();
    setTimeout(()=>window.print(), 80);
  }
  if(a==='paste-sync'){
    showSheet(`<h3>Paste Sync Code</h3>
      <textarea id="sync-paste" rows="6" style="width:100%;font-family:monospace;font-size:12px;padding:8px;border:1.5px solid var(--line);border-radius:8px" placeholder="Paste the GNM1:... code here"></textarea>
      <button class="btn-p btn-block" style="margin-top:10px" id="sync-apply">Restore from code</button>`,
      root=>{ document.getElementById('sync-apply').onclick=async ()=>{
        let d;
        try{ d=decodeSyncCode(document.getElementById('sync-paste').value); }
        catch(e){ notify('Not a sync code', 'Paste the whole code, starting with GNM1:'); return; }
        if(await confirmRestore('Restore from this code?', d)){ replaceAll(d); render(); }
      };});
  }
  if(a==='import-data'){
    const f=document.getElementById('import-file');
    f.onchange=()=>{ if(f.files[0]) doImport(f.files[0]); f.value=''; };
    f.click();
  }
  if(a==='toggle-player'){const p=DB.players.find(p=>p.id===d.id); p.active=!p.active; save(); render();}
  if(a==='cycle-avail'){
    const p=DB.players.find(p=>p.id===d.id);
    const cur=p.avail||'unset';
    p.avail=AVAIL_CYCLE[(AVAIL_CYCLE.indexOf(cur)+1)%AVAIL_CYCLE.length];
    if(p.avail==='unset') delete p.avail;
    save(); render();
  }
  if(a==='edit-num'){
    const p=DB.players.find(p=>p.id===d.id);
    const v=await askText(`Jersey number for ${p.name}`, p.num||'', 'numeric');
    if(v!==null){ p.num=parseInt(v)||null; save(); render(); }
  }
  if(a==='del-player'){
    /* hidden rather than deleted, so saved matches, scorer tables and the
       season report still show their name instead of "Team" */
    const p=DB.players.find(p=>p.id===d.id);
    if(await ask(`Remove ${p.name}?`, 'Her goals, appearances and attendance stay in saved matches and reports.', 'Remove from squad', true)){
      p.removed=true; p.active=false; delete p.avail; save(); render();
    }
  }
  if(a==='sess-all'){document.querySelectorAll('.ss-chk').forEach(c=>c.checked=true);}
  if(a==='save-session'){
    const present=[...document.querySelectorAll('.ss-chk:checked')].map(c=>c.value);
    const date=document.getElementById('ss-date').value||today();
    const ex=sessEdit && DB.sessions.find(s=>s.id===sessEdit);
    if(ex){
      /* keep players who've since gone off the panel — they aren't in the tick list */
      const listed=new Set(activePlayers().map(p=>p.id));
      const kept=ex.present.filter(id=>!listed.has(id));
      Object.assign(ex,{date, type:sessType, present:[...kept, ...present]});
      sessOpen=ex.id; sessEdit=null; sessType='pitch';
    }
    else{
      if(!present.length && !(await ask('Nobody is ticked', 'Save this session with nobody marked present?', 'Save anyway'))) return;
      DB.sessions.push({id:uid(), date, type:sessType, present});
    }
    save(); render();
  }
  if(a==='edit-sess'){
    const s=DB.sessions.find(s=>s.id===d.id);
    sessEdit=s.id; sessType=s.type; render(); window.scrollTo({top:0, behavior:'smooth'});
  }
  if(a==='sess-cancel'){ sessEdit=null; sessType='pitch'; render(); }
  if(a==='open-sess'){sessOpen= sessOpen===d.id? null : d.id; render();}
  if(a==='del-sess'){ if(await ask('Delete this session?', 'Attendance figures will be recalculated.', 'Delete session', true)){ DB.sessions=DB.sessions.filter(s=>s.id!==d.id); if(sessEdit===d.id) sessEdit=null; save(); render(); } }
  if(a==='del-test'){
    if(await ask('Delete this test result?', '', 'Delete', true)){
      DB.tests=DB.tests.filter(t=>t.id!==d.id); save(); render();
    }
  }
  if(a==='save-tests'){
    const custom= lvlTest==='__c', def= custom? null : TESTS[+lvlTest];
    const test= custom? document.getElementById('lv-custom').value.trim() : def.name;
    if(!test){ notify('Name the test', 'Type a name for the custom test first.'); return; }
    const date=document.getElementById('lv-date').value||today();
    const key= custom? 'c' : lvlTest;
    const results=[], bad=[];
    activePlayers().forEach(p=>{
      if(def && def.bleep){
        const lv=document.getElementById(`lv-b-${p.id}-l`).value.trim(), sh=document.getElementById(`lv-b-${p.id}-s`).value.trim();
        if(!lv && !sh) return;
        const level=parseInt(lv,10), shuttle=parseInt(sh,10);
        if(!(level>=1 && level<=21 && shuttle>=1 && shuttle<=16)){ bad.push(p.name); return; }
        results.push({playerId:p.id, level, shuttle, value:level+shuttle/100});
      } else {
        const raw=document.getElementById(`lv-${key}-${p.id}`).value.trim();
        if(!raw) return;
        const value=parseFloat(raw);
        if(!(value>0)){ bad.push(p.name); return; }
        results.push({playerId:p.id, value});
      }
    });
    if(bad.length){ notify('Check these results', `${bad.join(', ')}: ${def&&def.bleep? 'level must be 1–21 and shuttle 1–16' : 'enter a number above 0'}. Nothing was saved yet.`); return; }
    if(!results.length){ notify('No results entered', 'Fill in a result for at least one player.'); return; }
    /* a second entry for the same player, test and day replaces the first, so a corrected time doesn't count twice */
    let replaced=0;
    results.forEach(r=>{
      const i=DB.tests.findIndex(e=>e.playerId===r.playerId && e.test===test && e.date===date);
      if(i>=0){ DB.tests.splice(i,1); replaced++; }
      DB.tests.push({id:uid(), test, date, ...r});
    });
    /* this test's typed results are saved; drop them from the draft */
    const prefix= def&&def.bleep? 'lv-b-' : `lv-${key}-`;
    Object.keys(testDraft).forEach(k=>{ if(k.startsWith(prefix)) delete testDraft[k]; });
    save(); render();
    notify(`Saved ${results.length} result${results.length===1?'':'s'}`, `${test} on ${fmtDate(date)}.${replaced?` ${replaced} replaced an earlier entry from the same day.`:''}`);
  }
  if(a==='start-match'){
    const opp=document.getElementById('mt-opp').value.trim();
    if(!opp){notify('Who are we playing?', 'Enter the opposition first.'); return;}
    if(pickLineup.size!==15 && !(await ask(pickLineup.size? `${pickLineup.size} starters picked` : 'No starting team picked',
      pickLineup.size? 'You have not picked 15. Start the match anyway?' : 'Subs, game time and the "who scored" list won\'t know who is on the pitch.', 'Start anyway'))) return;
    DB.live={id:uid(), date:document.getElementById('mt-date').value||today(), opponent:opp,
      comp:document.getElementById('mt-comp').value, lineup:[...pickLineup], half:1, events:[],
      timer:timerReset(DEFAULT_HALF)};
    pickLineup=new Set(); save(); render();
  }
  if(a==='sub'){openSubPicker();}
  if(a==='edit-pos'){
    const p=DB.players.find(p=>p.id===d.id);
    showSheet(`<h3>${esc(p.name)} — position</h3>
      <div class="picker">${POS.map(x=>`<button data-pos="${x}"><span class="tag-num" style="font-size:11px">${x}</span>${POS_LABEL[x]}</button>`).join('')}<button data-pos=""><span class="tag-num">–</span>No position</button></div>`,
      el=>{ el.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{
        p.pos=b.dataset.pos; save(); closeSheet(); render(); }); });
  }
  if(a==='copy-match'){
    const m=DB.matches.find(m=>m.id===d.id);
    if(m){ copyText(matchSummary(m), el); }
  }
  if(a==='set-half'){
    const h=+d.h;
    if(h===DB.live.half) return; /* already in this half — don't wipe the clock on a stray tap */
    const t=DB.live.timer;
    if(t && timerElapsedMs(t,Date.now())>0 && h<DB.live.half && !(await ask('Go back to the 1st half?', 'This resets the clock.', 'Go back'))) return;
    if(h>DB.live.half) recordHalfLength(DB.live);
    DB.live.half=h;
    DB.live.timer=timerReset((t&&t.halfLen)||DEFAULT_HALF);
    save(); render();
  }
  if(a==='timer-toggle'){
    const t=DB.live.timer||timerReset(DEFAULT_HALF);
    DB.live.timer= t.running? timerPause(t) : timerStart(t);
    save(); render();
  }
  if(a==='timer-reset'){
    if(await ask('Reset the clock for this half?', '', 'Reset clock', true)){
      DB.live.timer=timerReset((DB.live.timer&&DB.live.timer.halfLen)||DEFAULT_HALF);
      save(); render();
    }
  }
  if(a==='timer-halflen'){
    const presets=[15,20,25,30,35];
    const cur=(DB.live.timer&&DB.live.timer.halfLen)||DEFAULT_HALF;
    const next=presets[(presets.indexOf(cur)+1)%presets.length];
    DB.live.timer={...(DB.live.timer||timerReset(DEFAULT_HALF)), halfLen:next};
    save(); render();
  }
  if(a==='score'){openScorerPicker(d.type);}
  if(a==='opp'){logEvent({team:'them',type:d.type}); save(); render();}
  if(a==='team-ev'){logEvent({team:'us',type:d.type}); save(); render();}
  if(a==='stat-minus'){
    for(let i=DB.live.events.length-1;i>=0;i--){
      if(DB.live.events[i].type===d.type){DB.live.events.splice(i,1);break;}
    }
    save(); render();
  }
  if(a==='undo'){DB.live.events.pop(); save(); render();}
  if(a==='edit-event'){openEventEditor(+d.idx);}
  if(a==='abandon'){if(await ask('Discard this match?', 'Every score and stat logged so far is deleted.', 'Discard match', true)){DB.live=null; save(); render();}}
  if(a==='end-match'){
    if(await ask('Full time?', 'Save this match to the season history.', 'Save match')){
      const m=DB.live; recordHalfLength(m); m.status='final'; DB.matches.push(m); DB.live=null;
      save(); TAB='history'; render();
    }
  }
  if(a==='toggle-gt'){showGT=!showGT; render();}
  if(a==='open-hist'){histOpen= histOpen===d.id? null : d.id; render();}
  if(a==='del-match'){if(await ask('Delete this match?', 'Its scores, subs and game time are removed from the season.', 'Delete match', true)){DB.matches=DB.matches.filter(m=>m.id!==d.id); save(); render();}}
}

/* Update just the on-screen clock every second while a timer is running —
   avoids a full re-render (which would disrupt scroll position / open sheets). */
setInterval(()=>{
  if(TAB==='match' && DB.live && DB.live.timer && DB.live.timer.running){
    const clockEl=document.querySelector('.timer-clock');
    const subEl=document.querySelector('.timer-sub');
    if(clockEl){
      const t=DB.live.timer;
      const elapsed=timerElapsedMs(t, Date.now());
      const halfMs=(t.halfLen||DEFAULT_HALF)*60*1000;
      const remaining=halfMs-elapsed;
      const over=remaining<0;
      clockEl.textContent=(over?'+':'')+timerFmt(Math.abs(remaining));
      clockEl.parentElement.classList.toggle('over', over);
      if(subEl) subEl.textContent=(over?'into injury time':'remaining this half')+` · ${t.halfLen||DEFAULT_HALF}min halves`;
    }
  }
}, 1000);

load();
</script>
</body>
</html>
